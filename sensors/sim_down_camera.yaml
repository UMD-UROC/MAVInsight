# The simulated down facing camera. The v3 airframe carries one and the v2 does
# not, exactly as on the aircraft. It sits at base_link in this model rather
# than the aircraft's (0.10, 0, -0.06).

display_name: Down Facing Camera (D${N}, simulated)
executable: camera
sensor_type: camera

frame_name: d${N}_pilot
parent_frame: d${N}_base_link
# Pitch of 90 degrees turns the camera x axis from forward to down.
offset: [0.0, 0.0, 0.0, 0.0, 90.0, 0.0]

cam_info_topic: /uas${N}/dcam_info
