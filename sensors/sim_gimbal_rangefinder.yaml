# The simulated gimbal laser. It rides the same CGO3 arm the camera does, so it
# carries the same offset from the pivot. The 25 mm across the boresight is the
# aircraft's figure and the simulator's alike.

display_name: Rangefinder (Gimbal, D${N}, simulated)
executable: rangefinder
sensor_type: rangefinder

frame_name: d${N}_rangefinder_frame
parent_frame: d${N}_gimbal_frame
offset: [0.074, 0.025, -0.162, 0.0, 0.0, 0.0]

range_topic: /uas${N}/gimbal_lidar_50m
