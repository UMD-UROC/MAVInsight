# The Chimera airframe, as MAVInsight sees it.
#
# ${N} is the UAS number, and launch_sim.launch.py substitutes it, so one file
# describes every vehicle. The airframe MODEL decides the sensor set. The UAS
# NUMBER decides the identity. Camera calibration is neither: two vehicles of
# one model carry different lenses, so it stays in the 5g_drone vehicle
# parameter files.
#
# Frame tree, from px4-sim-stack/docs/uas-contract.md section 5.

display_name: Chimera D${N}
executable: vehicle
platform: quad
gimbal_has_yaw_axis_by_model:
  v2: false
  v3: true

# Path de-duplication radius. A pose sample within this distance of the last
# point kept on the flightPath is dropped, so a vehicle holding station does not
# grow the Path message while standing still.
position_tolerance: 0.0762 # (3 inches)

frame_name: uas${N}_base_link
parent_frame: uas${N}_ekf_origin
pose_frame: enu_flu
ekf_origin_frame: uas${N}_ekf_origin
home_frame_name: uas${N}_home_position
uncorrected_home_frame_name: uas${N}_home_uncorrected

# Keep the GPS-derived placement and fiducial correction on separate edges:
# fiducial -> home_uncorrected -> home_position. Existing consumers retain the
# corrected home_position frame while a survey can explicitly use the raw one.
fiducial_frame: fiducial

# The gimbal publishes its attitude against a reference frame, but the VEHICLE
# publishes that reference frame, because the body pose updates far more often
# than the gimbal pose does. The code derives both names from the gimbal's own
# frame_name, and nothing checks that these two agree with it.
gimbal_offset_frame: uas${N}_gimbal_frame_offset
gimbal_ref_frame: uas${N}_gimbal_frame_ref

# Attitude reference conventions are an airframe property. V3 reports attitude
# in the earth frame even while its MAVLink flags say vehicle frame, so use the
# earth-fixed ENU-north reference (+90 degrees about Z) rather than its heading.
gimbal_reference_by_model:
  v2:
    gimbal_reference_apply_stabilization_correction: true
    gimbal_reference_yaw_frame: reported
    gimbal_reference_rotation_deg: [0.0, 0.0, 0.0]
  v3:
    gimbal_reference_apply_stabilization_correction: true
    gimbal_reference_yaw_frame: earth
    gimbal_reference_rotation_deg: [0.0, 0.0, 0.0]

namespace: /uas${N}/
altitude_topic: /uas${N}/altitude
ekf_origin_fix_topic: /uas${N}/ekf_origin/fix
fiducial_update_topic: /uas${N}/fiducial_update
gimbal_flags_topic: /uas${N}/gimbal_control/device/attitude_status
home_fix_topic: /uas${N}/home_position/fix
home_position_topic: /uas${N}/home_position/home
location_topic: /uas${N}/local_position/pose
velocity_topic: /uas${N}/local_position/velocity_local

# The sensor set, by model. Contract sections 3 and 5. The launch turns the
# chosen list into this node's `sensors` parameter.
models:
  v2:
    - gimbal.yaml
  v3:
    - gimbal.yaml
    - down_camera.yaml
